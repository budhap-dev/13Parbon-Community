<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A Bengali cultural association in Leeds. Twelve months, thirteen festivals — see what is coming up and come along." />

    <!--
      What WhatsApp, Facebook and the rest show when somebody shares a link to the site. Their
      crawlers do not run JavaScript, so these have to be here in the served HTML rather than
      set by the app: whatever page is shared, this is the card that appears. The image is a
      real file at an absolute address for the same reason — a relative path is not resolvable
      by something fetching the page from outside.

      Redraw the image with: node scripts/make-share-card.mjs
    -->
    <link rel="canonical" href="https://13parbon.org.uk/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="13Parbon Community" />
    <meta property="og:title" content="13Parbon Community" />
    <meta property="og:description" content="A Bengali cultural association in Leeds. Twelve months, thirteen festivals — see what is coming up and come along." />
    <meta property="og:url" content="https://13parbon.org.uk/" />
    <meta property="og:image" content="https://13parbon.org.uk/brand/share-card.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The 13Parbon Community logo beside the name and বারো মাসে তেরো পার্বণ" />
    <meta property="og:locale" content="en_GB" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="13Parbon Community" />
    <meta name="twitter:description" content="A Bengali cultural association in Leeds. Twelve months, thirteen festivals — see what is coming up and come along." />
    <meta name="twitter:image" content="https://13parbon.org.uk/brand/share-card.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Caveat:wght@700&family=Tiro+Bangla&family=Hind+Siliguri:wght@400;600&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Caveat:wght@700&family=Tiro+Bangla&family=Hind+Siliguri:wght@400;600&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Caveat:wght@700&family=Tiro+Bangla&family=Hind+Siliguri:wght@400;600&display=swap"
      />
    </noscript>
    <meta name="theme-color" content="#7a1a12" />
    <title>13Parbon Community</title>
    <script>
      // The portal wears its own quiet set, so a reload there starts in it rather than in
      // Festival red. The same test and list as scopeForPath and portalThemeNames in themes.ts.
      var portal = /^\/(portal|admin)(\/|$)/.test(location.pathname)
      try {
        var portalThemes = ['paper', 'linen', 'sage', 'mist', 'slate', 'midnight', 'marigold', 'lagoon', 'peacock']
        var chosen = localStorage.getItem('13parbon:portal-theme')
        // Elsewhere, the visitor's own choice, or failing that the committee's as this browser last heard it.
        var theme = portal
          ? portalThemes.indexOf(chosen) >= 0 ? chosen : 'paper'
          : localStorage.getItem('13parbon:theme') || localStorage.getItem('13parbon:site-theme')
        if (theme) document.documentElement.dataset.theme = theme
      } catch (error) {
        // Storage blocked: no choice to read, but the portal still is not the festivals.
        if (portal) document.documentElement.dataset.theme = 'paper'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
