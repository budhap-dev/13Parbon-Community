name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Every pull request moves the version on, so the footers say which release is live.
      - name: Version bumped
        if: github.event_name == 'pull_request'
        run: |
          git fetch --depth=1 origin main
          node scripts/check-version.mjs "$(git show origin/main:package.json | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).version')"

      - run: npm run lint
      - run: npm run typecheck
      # Coverage, not plain test: vite.config.ts sets a 70% floor and nothing was checking
      # it, so the threshold had been decoration since it was written.
      - run: npm run test:coverage
      - run: npm run build
